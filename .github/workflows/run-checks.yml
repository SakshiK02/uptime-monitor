name: Run monitor checks

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:         # lets you run it manually from the Actions tab

concurrency:
  group: run-checks
  cancel-in-progress: false

jobs:
  run-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify DATABASE_URL secret is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL is missing. Add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run checks
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: not-used-by-this-command
          DEBUG: "False"
        run: python manage.py run_checks
